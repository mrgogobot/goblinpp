name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Use the retained Rust 1.92.0 compiler
        run: rustup default 1.92.0
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test
        env:
          GOBLIN_MATH_REPORT_PATH: ${{ github.workspace }}/target/math-evidence/report.json
          GOBLIN_RNG_REPORT_PATH: ${{ github.workspace }}/target/math-evidence/rng-report.json
        run: cargo test --locked
      - name: Preserve measured math evidence
        uses: actions/upload-artifact@v7
        with:
          name: math-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: target/math-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release executable
        run: cargo build --locked --release

  math-evidence:
    name: Cross-platform numerical evidence
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use the retained Rust 1.92.0 compiler
        run: rustup default 1.92.0
      - uses: actions/download-artifact@v8
        with:
          pattern: math-evidence-*
          path: target/platform-evidence
      - name: Build exact evidence verifier
        run: cargo build --locked
      - name: Test report gate
        run: python3 -m unittest discover -s tools/tests
      - name: Compare measured platforms and engines
        run: >-
          python3 tools/compare_math_reports.py
          --latest-per-platform target/platform-evidence
          --goblinpp target/debug/goblinpp --require-macos-linux
      - name: Compare exact seeded RNG platforms and engines
        run: python3 tools/compare_rng_reports.py target/platform-evidence

  vscode:
    name: VS Code extension tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use the retained Rust 1.92.0 compiler
        run: rustup default 1.92.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build Rust test executable
        run: cargo build --locked
      - name: Test extension
        working-directory: vscode
        env:
          GOBLINPP_BIN: ${{ github.workspace }}/target/debug/goblinpp
        run: npm test
